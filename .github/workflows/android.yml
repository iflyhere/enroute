name: Compile on Android

on:
  push:
    branches: [ develop ]
    paths-ignore: &paths-ignore
      - ".gitignore"
      - "README.md"
      # The Wear OS app is a standalone Gradle project, built by wearos.yml
      - "wearos/**"
      # ignore CI for other platforms
      - ".github/workflows/api.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/linux.yml"
      - ".github/workflows/macos.yml"
      - ".github/workflows/wearos.yml"
  pull_request:
    branches: [ main, develop ]
    paths-ignore: *paths-ignore

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout enroute
      uses: actions/checkout@v4
      with:
        path: enroute
        submodules: recursive
        fetch-depth: 0
    - name: Checkout enrouteDependencies
      uses: actions/checkout@v4
      with:
        path: enrouteDependencies
        repository: Akaflieg-Freiburg/enrouteDependencies
        submodules: recursive
    # Fork only, and temporary. Qt's package index currently lists nothing for the
    # Android target above 6.7.3, although the packages download fine:
    # `aqt install-qt linux android 6.11.2 android_arm64_v8a` works today.
    # jurplel/install-qt-action cannot get past it, because it resolves the version
    # with `aqt list-qt --spec <version> --latest-version` before installing anything,
    # unconditionally and with no way to skip it. Upstream never reaches that call --
    # their repository has a warm action cache -- so only forks and fresh clones are
    # affected. Same version, same architecture, same modules; put the action back when
    # the index is fixed.
    - name: Install Qt for Android arm64
      run: |
        python3 -m pip install --quiet "aqtinstall==3.3.*"
        QT_BASE="${{ runner.workspace }}/Qt"
        MODULES="qt5compat qtconnectivity qthttpserver qtimageformats qtlocation qtmultimedia qtpositioning qtsensors qtserialport qtshadertools qtspeech qttasktree qtwebsockets qtwebview"
        # The host build first: a cross build needs it, and the compile steps below
        # look for it beside the Android one as ../gcc_64.
        python3 -m aqt install-qt linux desktop 6.11.2 linux_gcc_64 \
          --outputdir "$QT_BASE" --modules $MODULES
        python3 -m aqt install-qt linux android 6.11.2 android_arm64_v8a \
          --outputdir "$QT_BASE" --modules $MODULES
        echo "QT_ROOT_DIR=$QT_BASE/6.11.2/android_arm64_v8a" >> "$GITHUB_ENV"
    - name: Set up OpenJDK 21
      uses: actions/setup-java@v4
      with:
        distribution: adopt
        java-version: 21
    - name: Setup ninja
      uses: seanmiddleditch/gha-setup-ninja@v5
    - name: Install Additional Software
      run: |
        echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"
        echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
        echo ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018 >> $GITHUB_ENV
    - name: Remove Unwanted Software
      run: |
        echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --uninstall "platforms;android-33-ext4" "platforms;android-33-ext5" "platforms;android-34-ext8" "platforms;android-35-ext14"
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: android
        max-size: "500M"  # Limit cache size (default is 2G)  
    - name: Compile and Install libzip
      run: |
        export QT_HOST_PATH="$(readlink -f "$QT_ROOT_DIR/../gcc_64")"
        $QT_ROOT_DIR/bin/qt-cmake \
          -S enrouteDependencies/libzip \
          -B build-libzip \
          -G Ninja  \
          -DBUILD_DOC=OFF \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_REGRESS=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TOOLS=OFF \
          -DENABLE_BZIP2=OFF \
          -DENABLE_LZMA=OFF \
          -DENABLE_ZSTD=OFF \
          -DCMAKE_INSTALL_PREFIX=$QT_ROOT_DIR
        cmake --build build-libzip
        cmake --install build-libzip
        rm -rf build-libzip
    - name: Compile and Install maplibre-native-qt
      run: |
        export QT_HOST_PATH="$(readlink -f "$QT_ROOT_DIR/../gcc_64")"
        $QT_ROOT_DIR/bin/qt-cmake \
          -S enrouteDependencies/maplibre-native-qt-flat \
          -B build-maplibre-native-qt \
          -G Ninja \
          -DBUILD_TESTING=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR \
          -DCMAKE_INSTALL_PREFIX=$QT_ROOT_DIR
        cmake --build build-maplibre-native-qt
        cmake --install build-maplibre-native-qt
        rm -rf build-maplibre-native-qt
    - name: Compile Enroute
      run: |
        export QT_HOST_PATH="$(readlink -f "$QT_ROOT_DIR/../gcc_64")"
        $QT_ROOT_DIR/bin/qt-cmake \
          -S enroute \
          -B build-enroute\
          -G Ninja\
          -DCMAKE_BUILD_TYPE:STRING=Debug
        cmake --build build-enroute
    - name: Upload debug APK as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: enroute-android-debug
        path: build-enroute/src/android-build/build/outputs/apk/debug/android-build-debug.apk
        if-no-files-found: error
    - name: Upload to developerBuilds
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: |
        gh release upload --clobber developerBuilds ../build-enroute/src/android-build//build/outputs/apk/debug/android-build-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      working-directory: enroute
