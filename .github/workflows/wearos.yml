name: Compile Wear OS companion

# The Wear OS app under wearos/ is a standalone Gradle project that shares no build
# system with the Qt app, so this uses a paths allow-list rather than the
# paths-ignore list the platform workflows use: an ignore-list would have to
# enumerate the whole rest of the tree. The platform workflows in turn ignore
# wearos/, so a watch-only change does not spend four Qt builds.
on:
  push:
    branches: [ develop ]
    paths: &paths
      - "wearos/**"
      - ".github/workflows/wearos.yml"
  pull_request:
    branches: [ main, develop ]
    paths: *paths

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: wearos

    steps:
    - name: Checkout enroute
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 1
    - name: Set up OpenJDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    # gradle-wrapper.jar is a committed binary. This verifies it against the
    # checksums Gradle publishes, so nobody has to take it on trust.
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        build-root-directory: wearos
    - name: Install Additional Software
      run: |
        echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
    - name: Assemble debug APK
      run: ./gradlew --no-daemon :app:assembleDebug
    - name: Unit tests
      run: ./gradlew --no-daemon :app:testDebugUnitTest
    - name: Android Lint
      run: ./gradlew --no-daemon :app:lintDebug
    # The companion protocol exists so that the watch app needs no proprietary
    # Google library. This makes that auditable rather than a claim.
    - name: Dependency report
      run: ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > dependencies.txt
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: enroute-wear-debug
        path: |
          wearos/app/build/outputs/apk/debug/app-debug.apk
          wearos/app/build/reports/tests/testDebugUnitTest/**
          wearos/app/build/reports/lint-results-debug.html
          wearos/dependencies.txt
        if-no-files-found: warn
